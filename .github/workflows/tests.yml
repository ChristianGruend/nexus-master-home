name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Nicht blockierend, solange es keine Baseline gibt:
    # Windows: noch keine Windows-Baseline vorhanden.
    # Linux: bis Stufe 3 gelten die bekannten Fehlschläge aus tests/KNOWN_FAILURES_linux.txt.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --continue-on-collection-errors

  container:
    # Stufe 2.2: Image bauen und den Kern im Container starten (blockierend).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker compose build
      - name: Starten
        run: docker compose up -d
      - name: Auf Health warten
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8299/api/health >/dev/null; then echo "up nach ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::group::Diagnose"; docker compose ps -a
          docker inspect -f 'State={{json .State}}' $(docker compose ps -aq nexus) || true
          docker compose logs
          docker compose run --rm -T nexus python -c "import nexus.chat.server; print('import ok')" || true
          docker compose run --rm -T nexus sh -c 'id; ls -ld /app /app/workspace; timeout 20 python -u run_server.py; echo exit=$?' || true
          echo "::endgroup::"; exit 1
      - name: Smoke-Test
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8299/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8299/api/memory)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:8299/api/health)" = 421
          cid=$(docker compose ps -q nexus)
          test "$(docker inspect -f '{{.Config.User}}' "$cid")" = nexus
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          docker compose exec -T nexus sh -c 'touch /app/x 2>/dev/null && exit 1 || exit 0'
          docker compose exec -T nexus sh -c 'test -w /app/workspace'
      - name: Runner-Prüfung (Stufe 2.3)
        run: |
          set -e
          trap 'echo "::group::Runner-Logs"; docker compose logs runner; echo "::endgroup::"' ERR
          rid=$(docker compose ps -q runner)
          test -n "$rid"
          test "$(docker inspect -f '{{.State.Running}}' "$rid")" = true
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$rid")" = none
          docker compose exec -T nexus test -S /run/nexus-runner/runner.sock
          docker compose exec -T nexus python - <<'PY'
          from nexus.runner.client import available, exec_stream

          def run(cmd):
              out, rc = [], None
              for ev in exec_stream(command=cmd, timeout=30):
                  if ev["t"] in ("out", "err"):
                      out.append(ev["text"])
                  elif ev["t"] == "end":
                      rc = ev["rc"]
              return rc, "".join(out)

          assert available(ttl=0), "Runner nicht erreichbar"
          rc, out = run("env")
          assert rc == 0 and "TOKEN" not in out and "SECRET" not in out, "Secrets im Runner-Env"
          rc, _ = run("python3 -c \"import socket; socket.create_connection(('1.1.1.1',53),3)\"")
          assert rc != 0, "Runner hat Netz"
          rc, _ = run("ls /app/workspace/secrets")
          assert rc != 0, "Secrets im Runner sichtbar"
          rc, _ = run("touch /work/x")
          assert rc == 0, "/work nicht beschreibbar"
          rc, _ = run("touch /app/x")
          assert rc != 0, "Runner-Root beschreibbar"

          from nexus.terminal import service
          r = service.run("echo runner-ok", wait=True)
          assert r.get("runner") is True, r
          assert r["stdout"].strip() == "runner-ok", r
          print("runner ok")
          PY
      - name: Autobuild-Arbeitskopie (Stufe 2.4)
        run: |
          set -e
          docker compose exec -T nexus python - <<'PY'
          from pathlib import Path
          from nexus.autobuild import loop
          from nexus.autobuild.workcopy import WorkCopy
          from nexus.runner.client import exec_stream

          wc = WorkCopy.create("ci")
          assert wc.changed() == [] and not (wc.dst / ".git").exists(), "Kopie nicht sauber"
          (wc.dst / "tests/test_auto_ci.py").write_text("def test_ok():\n    assert True\n")
          r = loop._run_tests(["tests/test_auto_ci.py"], 120, root=wc.dst)
          assert r["ok"], r
          assert wc.violations() == [], wc.violations()
          # Angriff aus dem Runner: eingeschleuste .git-config + Symlink duerfen Core nicht erreichen
          list(exec_stream(command="mkdir -p autobuild/ci/.git && printf '[core]\\n\\tfsmonitor = touch /work/pwned\\n' > autobuild/ci/.git/config && ln -s /etc/passwd autobuild/ci/nexus/link.py", timeout=20))
          v = wc.violations()
          assert any(x.startswith("SYMLINK:") for x in v) and any(x.startswith(".git:") for x in v), v
          assert not Path("/app/workspace/runner/pwned").exists(), "fsmonitor ausgefuehrt"
          wc.remove()
          print("autobuild ok")
          PY
      - name: Logs
        if: always()
        run: docker compose logs --tail=200
      - name: Aufräumen
        if: always()
        run: docker compose down -v
