name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Nicht blockierend, solange es keine Baseline gibt:
    # Windows: noch keine Windows-Baseline vorhanden.
    # Linux: bis Stufe 3 gelten die bekannten Fehlschläge aus tests/KNOWN_FAILURES_linux.txt.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --continue-on-collection-errors
