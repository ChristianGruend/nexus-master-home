<!doctype html><html><head><meta charset="utf-8"><title>NX Lipsync QA</title>
<link rel="stylesheet" href="/static/css/nexus-live-avatar.css?v=avatar20261026">
<style>body{margin:0;background:#0b1220;color:#cde;font:12px monospace}.row{display:flex;gap:8px;padding:8px}.av{width:240px;height:320px;position:relative}#log{white-space:pre;padding:8px}</style></head>
<body><div class="row"><div class="av" id="a_nexus"></div><div class="av" id="a_hermes"></div><div class="av" id="a_aether"></div><div class="av" id="a_gpt"></div></div><div id="log">init</div>
<script src="/static/js/nexus-live-avatar.js?v=avatar20261026"></script>
<script>
(async function(){
 const ids=['nexus','hermes','aether','gpt'], av={}, out=[];
 for(const id of ids){const L=await (await fetch('/static/assets/avatar_orig/'+id+'.json')).json(); av[id]=NXLive.mount(document.getElementById('a_'+id),{id,src:'/static/assets/avatar_orig/'+id+'.webp',landmarks:L});}
 // 3 s WAV: 180 Hz Traeger, Silben-Huellkurve 4 Hz (sprachaehnlich), als echtes <audio>-Element
 const sr=22050, N=sr*4, wav=new DataView(new ArrayBuffer(44+N*2)); const W=(o,s)=>{for(let k=0;k<s.length;k++)wav.setUint8(o+k,s.charCodeAt(k))};
 W(0,'RIFF');wav.setUint32(4,36+N*2,true);W(8,'WAVEfmt ');wav.setUint32(16,16,true);wav.setUint16(20,1,true);wav.setUint16(22,1,true);wav.setUint32(24,sr,true);wav.setUint32(28,sr*2,true);wav.setUint16(32,2,true);wav.setUint16(34,16,true);W(36,'data');wav.setUint32(40,N*2,true);
 for(let k=0;k<N;k++){const t=k/sr, env=Math.max(0,Math.sin(Math.PI*((t*4)%1)))**2; wav.setInt16(44+k*2, Math.round(26000*env*Math.sin(2*Math.PI*180*t)), true);}
 const audio=new Audio(URL.createObjectURL(new Blob([wav],{type:'audio/wav'}))); audio.loop=true;
 let an=null; try{ an=av.nexus.attachAudio(audio);}catch(e){out.push('attachAudio ERR '+e.message)}
 try{await audio.play(); out.push('audio.play OK');}catch(e){out.push('audio.play ERR '+e.message)} av.nexus.setState('speaking');
 const buf=an?new Float32Array(an.fftSize):null; let n=0;
 const iv=setInterval(()=>{let rms=0; if(an){an.getFloatTimeDomainData(buf); for(const v of buf) rms+=v*v; rms=Math.sqrt(rms/buf.length);}
   const s=av.nexus.st; out.push(['t='+(n*100)+'ms','paused='+audio.paused,'rms='+rms.toFixed(3),'open='+(+s.open).toFixed(3),'blink='+(+s.blink).toFixed(2),'gx='+(+s.gx).toFixed(2),'hermesOpen='+(+av.hermes.st.open).toFixed(3)].join(' '));
   if(++n>=40){clearInterval(iv); const opens=out.filter(l=>l.startsWith('t=')).map(l=>+l.match(/open=([\d.]+)/)[1]); const r=opens.map((v,i)=>v); document.title='blinks='+av.nexus.stats.blinks+' sacc='+av.nexus.stats.sacc+' DONE max_open='+Math.max(...r).toFixed(3)+' min_open='+Math.min(...r).toFixed(3); document.getElementById('log').textContent=document.title+'\nok='+ids.map(i=>i+':'+av[i].ok+'/'+av[i].mode).join(' ')+'\n'+out.join('\n');}
   else document.getElementById('log').textContent='run '+n;},100);
})();
</script></body></html>
